name: Renovate flake.lock

# Renovate's custom regex manager bumps the input SHAs in flake.nix, but the
# Mend-hosted app can't run `nix flake lock` to refresh flake.lock (no nix
# binary, and postUpgradeTasks commands aren't allowlisted on the hosted app).
# This workflow does that step instead: whenever Renovate pushes a branch, it
# re-locks and commits flake.lock back onto the same branch. Commits made with
# GITHUB_TOKEN don't retrigger workflows, so there's no loop.

on:
  push:
    branches:
      - "renovate/**"

permissions:
  contents: write

# A Renovate rebase force-pushes the branch; supersede any in-flight run so we
# only ever lock against the latest tree.
concurrency:
  group: renovate-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Re-lock flake inputs
        run: nix flake lock

      - name: Commit flake.lock if it changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already in sync with flake.nix; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "build(flake): sync flake.lock"
          git push origin "HEAD:$BRANCH"
