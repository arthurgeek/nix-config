name: Renovate flake.lock

# Renovate's custom regex manager bumps the input SHAs in flake.nix, but the
# Mend-hosted app can't run `nix flake lock` to refresh flake.lock (no nix
# binary, and postUpgradeTasks commands aren't allowlisted on the hosted app).
# This workflow does that step instead: whenever Renovate pushes a branch, it
# re-locks and commits flake.lock back onto the same branch, along with any
# vendorHash a source bump invalidated, then builds every flake package and
# reports the result as a status on the PR. Commits made with GITHUB_TOKEN
# don't retrigger workflows, so there's no loop.

on:
  push:
    branches:
      - "renovate/**"

permissions:
  contents: write
  # For the "build packages" commit status below.
  statuses: write

# A Renovate rebase force-pushes the branch; supersede any in-flight run so we
# only ever lock against the latest tree.
concurrency:
  group: renovate-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Re-lock flake inputs
        run: nix flake lock

      # Packages built from a source input (pkgs/*.nix) pin a vendorHash that
      # Renovate can't compute. Build each one's fetched dependencies; on a hash
      # mismatch, write the hash Nix reports back into the package file.
      - name: Refresh vendor hashes
        run: |
          for pkg in cli-proxy-api; do
            if out=$(nix build --no-link ".#packages.x86_64-linux.$pkg.goModules" 2>&1); then
              continue
            fi
            got=$(printf '%s\n' "$out" | sed -n 's/^ *got: *//p' | head -n 1)
            if [ -z "$got" ]; then
              printf '%s\n' "$out" >&2
              exit 1
            fi
            sed -i "s|vendorHash = \"sha256-[^\"]*\"|vendorHash = \"$got\"|" "pkgs/$pkg.nix"
            echo "$pkg: vendorHash -> $got"
          done

      - name: Commit flake.lock and vendor hashes if they changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- flake.lock pkgs; then
            echo "flake.lock and vendor hashes already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock pkgs
          git commit -m "build(flake): sync flake.lock and vendor hashes"
          git push origin "HEAD:$BRANCH"

      # Build every flake package (pkgs/: patched or source-built on top of
      # nixpkgs) against the bumped inputs, so a patch that no longer applies
      # or a source that no longer compiles shows up on the PR, not on the next
      # rebuild. The job's own check is attached to the commit Renovate
      # pushed, which the lock commit above may have superseded, so report the
      # result as a commit status on the branch's actual head.
      - name: Build flake packages
        id: build
        run: |
          nix eval --json .#packages.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[] | ".#packages.x86_64-linux.\(.)"' \
            | xargs nix build --no-link --print-build-logs

      - name: Report build status on the branch head
        if: always() && steps.build.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.build.outcome == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$STATE" \
            -f context="renovate-lock / build packages" \
            -f description="flake packages build: $STATE" \
            -f target_url="$RUN_URL"

  # Evaluate every host on every Renovate branch, whatever it bumped: a renamed
  # option, a package dropped from nixpkgs or a module error surfaces here
  # instead of on the next rebuild. Evaluation builds nothing, but some of it
  # builds small files for the host's own platform along the way, so each host
  # evaluates on a runner of its own OS.
  eval:
    needs: lock
    if: always() && needs.lock.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: rapture
            os: ubuntu-latest
            attr: nixosConfigurations.rapture.config.system.build.toplevel
          - host: columbia
            os: macos-latest
            attr: darwinConfigurations.columbia.system
    runs-on: ${{ matrix.os }}
    steps:
      # The branch, not the pushed commit: the lock job may have added one.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate ${{ matrix.host }}
        id: eval
        run: nix eval --raw ".#${{ matrix.attr }}.drvPath"

      - name: Report eval status on the branch head
        if: always() && steps.eval.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.eval.outcome == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$STATE" \
            -f context="renovate-lock / eval ${{ matrix.host }}" \
            -f description="${{ matrix.host }} evaluation: $STATE" \
            -f target_url="$RUN_URL"
